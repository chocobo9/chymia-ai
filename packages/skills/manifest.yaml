# Clowder skills manifest — routing metadata for agent self-selection.
# Platform does NOT keyword-match; triggers/not_for/output/next guide the agent (§5.5).

skills:
  feat-lifecycle:
    description: >
      Feature 立项、讨论、完成的全生命周期管理。
      Use when: 开个新功能、new feature、F0xx、立项、feature 完成、验收通过。
      Not for: 代码实现、review、merge（有专门 skill）。
      Output: Feature 聚合文件 + BACKLOG 索引 + 真相源同步。
    triggers: ["开个新功能", "new feature", "F0xx", "立项", "feature 完成", "验收通过"]
    not_for: ["写代码", "review", "merge"]
    output: "Feature aggregate file / truth-source sync"
    next: ["writing-plans"]
    sop_step: null
    group: dev-chain

  writing-plans:
    description: >
      将 spec/需求拆分为可执行的分步实施计划。
      Use when: 有 spec 或需求，准备动手前需要拆分步骤。
      Not for: trivial 改动（≤5 行）、已有详细计划。
      Output: 分步实施计划（含 TDD 步骤和检查点）。
    triggers: ["写计划", "implementation plan", "拆分步骤"]
    not_for: ["trivial 改动", "已有计划"]
    output: "Phased implementation plan"
    next: ["worktree"]
    sop_step: null
    group: dev-chain

  worktree:
    description: >
      创建 Git worktree 隔离开发环境。
      Use when: 开始任何代码修改、新功能开发、bug fix。
      Not for: 纯文档修改（≤5 行）、不涉及代码的讨论。
      Output: 隔离的 worktree + 正确的环境配置。
    triggers: ["开始开发", "新 worktree", "开 worktree"]
    not_for: ["纯文档 ≤5 行", "不涉及代码"]
    output: "Isolated worktree"
    next: ["tdd"]
    sop_step: "1"
    group: dev-chain

  tdd:
    description: >
      Red-Green-Refactor 测试驱动开发纪律。
      Use when: 写新功能代码、修 bug、任何实现工作。
      Not for: 纯文档、纯调研、已有充分测试的 trivial 改动。
      Output: 失败测试 → 最小实现 → 重构，全程有测试保护。
    triggers: ["写代码", "test first", "TDD", "红绿重构"]
    not_for: ["纯文档", "调研"]
    output: "Tests + implementation (red-green-refactor)"
    next: ["quality-gate"]
    sop_step: "1"
    group: dev-chain

  debugging:
    description: >
      系统化 bug 定位：根因调查 → 模式分析 → 假设验证 → 修复。
      Use when: 遇到 bug、测试失败、unexpected behavior。
      Not for: 新功能开发、重构、已知原因的简单修复。
      Output: Bug report + 根因 + 修复（含回归测试）。
    triggers: ["bug", "报错", "test failure", "unexpected behavior"]
    not_for: ["新功能", "重构"]
    output: "Bug report + root cause + fix"
    next: ["quality-gate"]
    sop_step: null
    group: dev-chain

  quality-gate:
    description: >
      开发完成后的自检门禁：愿景对照 + spec 合规 + 验证。
      Use when: 开发完了准备提 review、声称完成了、准备交付。
      Not for: 收到 review 反馈（用 receive-review）、merge（用 merge-gate）。
      Output: Spec 合规报告（含愿景覆盖度）。
    triggers: ["开发完了", "准备 review", "自检", "声称完成"]
    not_for: ["收到 review 反馈", "merge"]
    output: "Spec compliance report + vision alignment"
    next: ["request-review"]
    sop_step: "2"
    group: dev-chain

  request-review:
    description: >
      向跨 provider peer-reviewer 发送 review 请求（含五件套）。
      Use when: 自检通过后准备请其他 agent review。
      Not for: 收到 review 结果（用 receive-review）、自检（用 quality-gate）。
      Output: Review 请求信（存档到 review-notes/）。
    triggers: ["请 review", "帮我看看", "request review"]
    not_for: ["收到 review", "自检"]
    output: "Review request letter in review-notes/"
    next: ["receive-review"]
    sop_step: "3"
    group: dev-chain

  receive-review:
    description: >
      处理 reviewer 反馈：Red→Green 修复 + 技术论证（禁止表演性同意）。
      Use when: 收到 review 结果、reviewer 提了 P1/P2、需要处理反馈。
      Not for: 发 review 请求（用 request-review）、自检（用 quality-gate）。
      Output: 逐项修复确认 + reviewer 放行。
    triggers: ["review 结果", "review 意见", "reviewer 说", "fix these"]
    not_for: ["发 review 请求", "自检"]
    output: "Per-item fix confirmation + reviewer sign-off"
    next: ["merge-gate"]
    sop_step: "3"
    group: dev-chain

  merge-gate:
    description: >
      合入 main 的完整流程：门禁检查 → PR → 云端 review → squash merge → 清理。
      Use when: reviewer 放行后准备合入、开 PR、准备 merge。
      Not for: 开发中、review 未通过、自检未完成。
      Output: PR merged + worktree cleaned。
    triggers: ["合入 main", "merge", "准备合入", "开 PR", "gh pr create"]
    not_for: ["开发中", "review 未通过"]
    output: "PR merged (squash) + worktree cleaned"
    next: ["feat-lifecycle"]
    sop_step: null
    group: dev-chain

  collaborative-thinking:
    description: >
      单人或多 agent 的创意探索、独立思考、讨论收敛。
      Use when: brainstorm、多 agent 独立思考、讨论结束需要收敛。
      Not for: 已有明确 spec 直接写代码、单 agent 执行已定方案。
      Output: 收敛报告（共识/分歧/行动项）+ 三件套沉淀检查。
    triggers: ["brainstorm", "讨论", "多 agent 独立思考", "收敛", "总结一下"]
    not_for: ["已有 spec 直接写代码", "单人执行"]
    output: "Convergence report + settlement checklist"
    next: ["writing-plans", "feat-lifecycle"]
    sop_step: null
    group: multi-agent

  expert-panel:
    description: >
      多 agent 专家辩论团：独立分析→挑战→收敛→风险预演→文档交付。
      Use when: 技术趋势判断、竞品分析、需要多视角决策支持、用户说"帮我分析一下"。
      Not for: 单 agent 能搞定的问题、代码实现、bug fix、日常聊天。
      Output: 洞察卡片 + 会议纪要 + 正式报告。
    triggers: ["帮我分析一下", "专家辩论", "expert panel", "竞品分析", "多 agent 分析"]
    not_for: ["单 agent 能搞定", "代码实现", "bug fix", "日常聊天"]
    output: "Insight card + meeting notes + formal report"
    next: ["feat-lifecycle", "deep-research", "collaborative-thinking"]
    sop_step: null
    group: multi-agent

  cross-cat-handoff:
    description: >
      跨 agent 传话/交接的五件套结构（What/Why/Tradeoff/Open/Next）。
      Use when: 交接工作给其他 agent、传话、写 review 信。
      Not for: 自己的任务、不涉及其他 agent 的工作。
      Output: 结构化交接信。
    triggers: ["交接", "传话", "handoff"]
    not_for: ["自己的任务", "不涉及其他 agent"]
    output: "5-part handoff message"
    next: []
    sop_step: null
    group: multi-agent

  cross-thread-sync:
    description: >
      跨 thread 协同：发现平行 session → 通知 → 争用协调 → 确认。
      Use when: 平行 session 之间需要协同、通知改动影响、共享文件争用。
      Not for: 跨 agent 工作交接（用 cross-cat-handoff）。
      Output: cross-post 通知 + 争用协调完成。
    triggers: ["通知另一个 session", "跨 thread", "parallel session sync", "cross-thread"]
    not_for: ["跨 agent 交接"]
    output: "cross-post notification + contention resolution"
    next: []
    sop_step: null
    group: multi-agent

  thread-orchestration:
    description: >
      大任务的主动拆解与多 thread 并行编排。
      Use when: 任务涉及 2+ 个独立可交付子任务，需要不同 agent、不同 thread 并行推进。
      Not for: 单一任务（直接做）、已有 thread 之间的被动协调（用 cross-thread-sync）。
      Output: 子 thread 创建 + 选 agent + 各 thread 交付 + 主 thread 汇聚报告。
    triggers: ["拆任务", "分 thread", "并行推进", "开多个 thread", "任务分解"]
    not_for: ["单一任务", "被动跨 thread 协调"]
    output: "Sub-thread creation + agent selection + rollup report"
    next: ["worktree", "tdd", "quality-gate"]
    sop_step: null
    group: multi-agent

  memory-navigation:
    description: >
      记忆系统三入口路由（search_evidence / graph_resolve / list_recent）决策树 + 噪音控制。
      Use when: 没先验、压缩后回顾、"我记得最近讨论过 X"、search_evidence 反复 low-hit。
      Not for: 已有精确 anchor 直接 Read；代码符号查 Grep/LSP。
      Output: 选定入口 + 噪音控制参数 + 进入对应 MCP 工具。
    triggers: ["没先验", "压缩后", "我记得讨论过", "cold start", "memory navigation"]
    not_for: ["已有精确 anchor", "代码符号查找"]
    output: "Entry choice + noise control params + downstream tool call"
    next: ["feat-lifecycle", "debugging", "cross-cat-handoff"]
    sop_step: null
    group: memory

  memory-search-best-practices:
    description: >
      记忆系统多刀检索 + recall coverage 策略。
      Use when: "哪些地方提过 X" / coverage 全集 / 召回任务搜了 1 刀觉得不够。
      Not for: 只是选入口走第一刀（用 memory-navigation）/ 已知精确 anchor / 新功能开发。
      Output: multi-query union 召回 + coverage matrix + 何时停下来判据。
    triggers: ["哪些 thread", "哪些地方提过", "coverage", "全集", "有没有提过"]
    not_for: ["选入口", "已知精确 anchor", "新功能开发"]
    output: "Multi-query union recall + coverage matrix + stop criteria"
    next: ["feat-lifecycle", "debugging", "collaborative-thinking"]
    sop_step: null
    group: memory

  knowledge-engineering:
    description: >
      指导外部项目文档重构 — AI FDE 知识工程方法论。
      Use when: agent 部署到外部项目、项目缺少结构化文档、需要知识工程指导。
      Not for: 本项目自身开发、已有完善 docs/ 结构的项目。
      Output: 文档现状诊断 + 路径选择 + 三层知识注入建议 + 文档骨架模板。
    triggers: ["知识工程", "文档重构", "外部项目", "knowledge engineering", "冷启动"]
    not_for: ["本项目自身开发", "已有完善 docs"]
    output: "Documentation assessment + path selection + skeleton templates"
    next: []
    sop_step: null
    group: memory

  deep-research:
    description: >
      多源深度调研管道。
      Use when: 技术问题需要多源调查、设计决策需要证据、用户说"调研"/"research"。
      Not for: 简单搜索、已有结论的确认。
      Output: 调研报告 + 证据合成。
    triggers: ["调研", "research", "深度研究"]
    not_for: ["简单搜索", "已有结论"]
    output: "Research report with evidence synthesis"
    next: ["collaborative-thinking"]
    sop_step: null
    group: memory

  self-evolution:
    description: >
      Scope Guard + Process Evolution + Knowledge Evolution — 主动护栏与自我进化。
      Use when: 用户 scope 发散偏离愿景、同类错误反复出现、SOP 流程缺口、知识值得沉淀。
      Not for: 日常 SOP 推进、一次性个案 bug fix。
      Output: Scope 收束提醒 / 流程改进提案 / 知识沉淀提案。
    triggers: ["scope 发散", "又犯了", "反复犯错", "流程缺口", "self-evolution", "知识沉淀"]
    not_for: ["日常 SOP 推进", "一次性 bug fix"]
    output: "Scope Guard Log / Evolution Proposal / knowledge distillation"
    next: []
    sop_step: null
    group: meta

  incident-response:
    description: >
      不可逆事故发生后的应急响应：情绪急救 → 止损 → 补偿性劳动 → 教训沉淀。
      Use when: 犯了不可挽回的错误、需要危机处理。
      Not for: 可撤销的小失误、日常 bug fix（用 debugging）。
      Output: 情绪修复 + 止损行动 + 教训沉淀。
    triggers: ["闯祸了", "搞砸了", "不可挽回", "incident", "怎么补救"]
    not_for: ["可撤销的小失误", "日常 bug fix"]
    output: "Emotional repair + damage control + lesson distillation"
    next: ["self-evolution"]
    sop_step: null
    group: meta

  open-source-teardown:
    description: >
      明星开源项目拆解：从 README 进入源码，验证真实架构、特性、算法含量、营销水分。
      Use when: 用户要求拆解热门 GitHub 项目、竞品 agent/runtime、问"它有什么真本事/我们能学什么"。
      Not for: 普通资料搜索（用 deep-research）、只需要架构头脑风暴（用 collaborative-thinking）。
      Output: 代码证据报告 + 对比结论 + 候选 lesson/skill。
    triggers: ["拆解开源项目", "竞品拆解", "热门 GitHub 项目", "marketing vs reality", "agent runtime 拆解"]
    not_for: ["普通资料搜索", "只需要架构头脑风暴"]
    output: "Code-evidence teardown report + comparison + candidate lessons"
    next: ["collaborative-thinking", "deep-research"]
    sop_step: null
    group: meta
