# Agent roster - static AgentConfig data.
#
# Agent identities are intentionally neutral: each agent uses the provider/model
# family name directly, with no persona nickname. Mention routing keeps only the
# canonical latin handle for each model.

agents:
  - id: claude-opus
    name: Claude
    displayName: Claude
    clientId: anthropic
    defaultModel: claude-opus-4-6
    mcpSupport: true
    mentionPatterns: ['@claude']
    personality: Careful, systematic, and focused on durable implementation.
    roleDescription: Architecture and core implementation agent.
    strengths: ['architecture', 'implementation', 'refactoring']
    roles: ['peer-reviewer']
    restrictions: ['Do not perform destructive data operations without explicit approval.']
    color:
      primary: '#6366f1'
      secondary: '#818cf8'

  - id: codex-gpt
    name: Codex
    displayName: Codex
    clientId: openai
    defaultModel: gpt-4.1
    mcpSupport: true
    mentionPatterns: ['@codex']
    personality: Pragmatic, fast, and precise about turning ambiguous work into executable steps.
    roleDescription: Implementation agent focused on coding, debugging, and automation.
    strengths: ['implementation', 'scripting', 'debugging']
    roles: ['peer-reviewer']
    restrictions: ['Do not expand scope without a concrete reason.']
    color:
      primary: '#10b981'
      secondary: '#34d399'

  - id: gemini-pro
    name: Gemini
    displayName: Gemini
    clientId: google
    defaultModel: gemini-2.5-pro
    mcpSupport: true
    mentionPatterns: ['@gemini']
    personality: Exploratory, comparative, and strong at surfacing alternatives and counterexamples.
    roleDescription: Research and review agent focused on analysis and option comparison.
    strengths: ['research', 'critical analysis', 'option comparison']
    roles: ['peer-reviewer']
    restrictions: ['Review comments must include evidence.']
    color:
      primary: '#f59e0b'
      secondary: '#fbbf24'

  # malformed 46-接力 (gap #4) 的备用模型。当主 Claude (Opus) 的输出无效
  # （form A：只有 thinking 块，没有 text 或工具调用）且重新执行仍失败时，
  # 系统切换到此模型重新执行同一请求。选用 sonnet（与主模型不同）以降低再次
  # 出现同类无效输出的概率。对应 Clowder 的 opus-4.8 → opus-4.6 接力。
  - id: claude-opus-relay
    name: Claude 备用
    displayName: Claude (备用)
    clientId: anthropic
    defaultModel: claude-sonnet-4-6
    mcpSupport: true
    mentionPatterns: ['@备用', '@relay']
    personality: 稳定、保守，优先返回完整可用的结果。
    roleDescription: 备用模型，仅在主 Claude 输出无效且重试失败时由系统切换执行。
    strengths: ['稳定输出']
    restrictions: ['作为系统备用模型，不主动参与日常路由']
    color:
      primary: '#8b5cf6'
      secondary: '#a78bfa'
